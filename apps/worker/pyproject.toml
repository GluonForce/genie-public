[project]
name = "genie-worker"
version = "0.1.0"
description = "Genie v2 build worker: runs the coding agent in E2B and publishes prototypes"
readme = "README.md"
authors = [
    { name = "Yehan", email = "yowzayehan@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.0",
    "e2b>=2.63.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-ai-slim[openrouter]>=2.56.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
genie-worker = "genie_worker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
# Copied from internal Genie: prompts and tool docstrings (sent to the model) are kept unwrapped
"src/genie_worker/agents/coding_agent.py" = ["E501"]
"src/genie_worker/core/openrouter.py" = ["E501"]
"src/genie_worker/core/platforms.py" = ["E501"]
"src/genie_worker/models/requirements.py" = ["E501"]
